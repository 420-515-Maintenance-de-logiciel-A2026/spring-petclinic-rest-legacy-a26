# .github/workflows/ci.yml (job autonome, séparé du job de tests en matrice)
name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: 
      - '*.*.*' 
  pull_request:
    branches: [ main ]
  

jobs:
