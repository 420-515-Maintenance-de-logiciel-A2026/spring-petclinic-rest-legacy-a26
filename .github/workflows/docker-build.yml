# .github/workflows/ci.yml (job autonome, séparé du job de tests en matrice)
name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: 
      - '*.*.*' 
  pull_request:
    branches: [ main ]
  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          
      - name: Provide access to mvnw
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw -B package -DskipTests

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.PERSONAL_GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convertir le nom du compte/organisation en minuscules
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sfostine/petclinic:latest
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/petclinic:{1}', vars.USERNAME, github.ref_name) || format('ghcr.io/{0}/petclinic:{1}', vars.USERNAME, github.sha) }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/*.jar