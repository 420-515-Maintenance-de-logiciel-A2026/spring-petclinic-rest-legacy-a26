# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

# NOTE COURS A26 : workflow hérité du dépôt upstream spring-petclinic-rest, conservé
# tel quel comme EXEMPLE de pipeline d'entreprise (voir Notes-de-cours-A26-detaillees.md,
# section 0). Déclenchement automatique désactivé (branche/organisation SonarCloud/secrets
# ne correspondent pas à ce dépôt de cours) : passé en workflow_dispatch (manuel) pour
# rester consultable/exécutable sur demande sans casser la CI des étudiants dès le TP1.
# Le VRAI pipeline du cours est celui construit progressivement par les équipes
# (semaines 5, 7, 9, 11-12).
name: Java CI on master branch (RÉFÉRENCE - déclenchement manuel)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=spring-petclinic_spring-petclinic-rest -Dsonar.organization=spring-petclinic
